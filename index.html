<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>WAQAS MART — Supermarket Management & POS Web App</title>
    <meta name="description" content="WAQAS MART - Professional Web Application for Supermarket Point of Sale, Purchase Entry, Total Stock, and Inventory Management" />
    <meta property="og:title" content="WAQAS MART — Supermarket Management & POS Web App" />
    <meta property="og:description" content="WAQAS MART - Professional Web Application for Supermarket Point of Sale, Purchase Entry, Total Stock, and Inventory Management" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Web App & PWA Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#00b852" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WAQAS MART" />
    <link rel="apple-touch-icon" href="/products/header_logo.png" />
    <link rel="icon" type="image/png" href="/products/header_logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#0a182c] text-slate-800 antialiased selection:bg-[#00b852] selection:text-white select-none min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for Offline POS Support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('WAQAS MART Service Worker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('Service Worker registration skipped or failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
